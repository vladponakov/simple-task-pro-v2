services:
  - type: web
    name: demo-taskpro
    env: python
    rootDir: backend
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd ../frontend
      npm ci
      npm run build
      cd ../backend
      mkdir -p app/static
      rm -rf app/static/*
      cp -r ../frontend/dist/* app/static/
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    # Kjøres før hver deploy – nå bruker vi NY seed-cli
    preDeployCommand: |
      python -m app.seed --reset

    envVars:
      # SQLite-fil på Render
      - key: DATABASE_URL
        value: sqlite:////data/app.db

      # Disse to lar du gjerne stå tomme i YAML og setter i Render-dashboardet
      - key: API_TOKEN
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false

      # Praktisk å ha backend-url tilgjengelig i utils (bruk ditt faktiske domene)
      - key: BACKEND_URL
        value: https://demo-taskpro.onrender.com

